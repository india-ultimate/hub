<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 16px;">
  <tr>
    {% if secondary %}
    <td align="center" bgcolor="#ffffff" style="padding:12px 26px;border:2px solid #1d4ed8;border-radius:8px;">
      <a href="{{ url }}" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;line-height:20px;color:#1d4ed8;text-decoration:none;">{{ label }}</a>
    </td>
    {% else %}
    <td align="center" bgcolor="#1d4ed8" style="padding:14px 28px;border-radius:8px;">
      <a href="{{ url }}" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;line-height:20px;color:#ffffff;text-decoration:none;">{{ label }}</a>
    </td>
    {% endif %}
  </tr>
</table>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{% block title %}India Ultimate Hub{% endblock %}</title>
    <style>
      @media only screen and (max-width: 620px) {
        .pad { padding-left: 20px !important; padding-right: 20px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:#f3f4f6;">
    <div data-notext style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
      <tr>
        <td align="center" style="padding:16px 8px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#1f2937;">
            <tr>
              <td align="center" bgcolor="#ffffff" style="padding:24px 28px 16px;background-color:#ffffff;">
                <img src="{{ site_url }}/static/assets/logo-vertical.png" width="56" alt="India Ultimate" style="display:block;border:0;height:auto;" />
              </td>
            </tr>
            <tr>
              <td class="pad" style="background-color:#1d4ed8;color:#ffffff;padding:18px 28px;">
                <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:bold;color:#ffffff;">{% block heading %}{% endblock %}</h1>
              </td>
            </tr>
            <tr>
              <td class="pad" style="padding:24px 28px 8px;font-size:16px;line-height:1.5;color:#1f2937;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td class="pad" style="padding:16px 28px 24px;font-size:13px;line-height:1.5;color:#4b5563;border-top:1px solid #e5e7eb;">
                Sent by India Ultimate Hub. Questions? Write to
                <a href="mailto:operations@indiaultimate.org" style="color:#1d4ed8;">operations@indiaultimate.org</a>.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

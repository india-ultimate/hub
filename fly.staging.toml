# fly.toml app configuration file generated for upai-hub-staging on 2023-10-13T00:11:21+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "upai-hub-staging"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"
swap_size_mb = 512

[experimental]
  auto_rollback = true

[build]
  dockerfile = "Dockerfile"
  [build.args]
    DJANGO_SETTINGS_MODULE = "hub.production"

[env]
  DJANGO_SETTINGS_MODULE = "hub.production"
  PORT = "8000"
  CLOUDINARY_MEDIA_PREFIX = "staging/media/"

[[services]]
  protocol = "tcp"
  internal_port = 80
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
    [services.http_checks.headers]
      # Fly sends the machine's IP, which Debian's default nginx site would answer.
      Host = "upai-hub-staging.fly.dev"

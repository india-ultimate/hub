app = "upai-hub-metabase"
primary_region = "ams"
kill_signal = "SIGTERM"
# Metabase (JVM) needs longer than the default to shut down cleanly.
kill_timeout = 30
# Suspend is incompatible with swap; omit swap_size_mb so idle machines
# can autosuspend instead of full-stopping (multi-minute Metabase boot).

[build]
  image = "metabase/metabase:latest"

[mounts]
  source="upai_hub_metabase_data"
  destination="/data"

[env]
# Tells Metabse to store the H2 database on
# the mounted volume.
MB_DB_FILE = "/data/metabase.db"

# Metabase builds its OAuth discovery URLs from this. Without it, it guesses
# http:// from the request behind Fly's proxy, and an MCP client refuses the
# mismatch against the https:// it connected to.
MB_SITE_URL = "https://upai-hub-metabase.fly.dev"

# Cap heap well below VM RAM. JVM RSS = heap + metaspace + threads + native;
# with -Xmx1536m on 2GB the kernel OOM-killed java at ~1.85GB RSS.
JAVA_TOOL_OPTIONS = "-Xmx2560m"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"

[http_service]
internal_port = 3000
force_https = true
# Suspend freezes the running JVM so wake is ~seconds, not a full Metabase
# boot. Requires no swap (see above). First boot after deploy is still slow.
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
hard_limit = 150
soft_limit = 100

[[http_service.checks]]
# Fly caps HTTP check grace_period at 1 minute (larger values are lowered).
# Metabase often needs several minutes to bind :3000, so deploys must use a
# long wait, e.g. --wait-timeout=15m (default is only 5m).
grace_period = "1m"
interval = "15s"
method = "GET"
timeout = "10s"
path = "/api/health"

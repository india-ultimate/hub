app = "upai-hub-metabase"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = 5
swap_size_mb = 512

[build]
  image = "metabase/metabase:latest"

[mounts]
  source="upai_hub_metabase_data"
  destination="/data"

[env]
# Tells Metabse to store the H2 database on
# the mounted volume.
MB_DB_FILE = "/data/metabase.db"

# Metabase builds its OAuth discovery URLs from this. Without it, it guesses
# http:// from the request behind Fly's proxy and the MCP client refuses the
# mismatch against the https:// it connected to.
MB_SITE_URL = "https://upai-hub-metabase.fly.dev"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
hard_limit = 150
soft_limit = 100

[[http_service.checks]]
grace_period = "60s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/health"
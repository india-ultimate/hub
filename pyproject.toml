[tool.poetry]
name = "hub"
version = "0.1.0"
description = "Hub for managing player information, subscription, etc for India Ultimate"
authors = ["Puneeth Chaganti <punchagan@muse-amuse.in>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11.5"
Django = "^4.2.1"
gunicorn = "^26.2.0"
django-ninja = "0.22.2"
razorpay = "^2.0.1"
django-stubs-ext = "^4.2.2"
redis = "^8.1.0"
dj-database-url = "^3.1.2"
psycopg2 = "^2.9.13"
python-dateutil = "^2.9.0"
pyotp = "^2.10.0"
sentry-sdk = {extras = ["django"], version = "^2.71.0"}
prettytable = "^3.18.0"
pyjwt = "^2.15.1"
django-prometheus = "^2.5.0"
thefuzz = "^0.22.1"
pillow = "^12.3.0"
groq = "^1.7.0"
cloudinary = "^1.46.3"
django-ckeditor = "^6.7.3"
xhtml2pdf = "^0.2.23"
num2words = "^0.5.14"
cryptography = "^50.0.2"

[tool.poetry.group.dev.dependencies]
ipython = "^9.17.1"
black = "^26.10.1"
ipdb = "^0.13.13"
beautifulsoup4 = "^4.15.0"
ruff = "^0.17.0"
pytest = "^9.1.1"
pytest-django = "^4.14.0"
mypy = "^1.4.1"
django-stubs = "^4.2.3"
types-requests = "^2.33.0.20261006"
selenium-base = "^4.56.0"
types-python-dateutil = "^2.9.0.20260807"
zulint = {git = "https://github.com/zulip/zulint.git"}
gitlint = "^0.19.1"
pytest-split = "^0.11.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
# https://beta.ruff.rs/docs/rules/#tryceratops-try
select = [
    "ANN", # annotations
    "B", # bugbear
    "C4", # comprehensions
    "COM", # trailing comma
    "DJ", # Django
    "DTZ", # naive datetime
    "E", # style errors
    "EXE", # shebang
    "F", # flakes
    "FLY", # string formatting
    "G", # logging format
    "I", # import sorting
    "INT", # gettext
    "ISC", # string concatenation
    "N", # naming
    "PGH", # pygrep-hooks
    "PIE", # miscellaneous
    "PL", # pylint
    "PYI", # typing stubs
    "Q", # quotes
    "RSE", # raise
    "RUF", # Ruff
    "S", # security
    "SIM", # simplify
    "T10", # debugger
    "UP", # upgrade
    "W", # style warnings
    "YTT", # sys.version
]
ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "COM812", # Trailing comma missing
    "DJ001", # Avoid using `null=True` on string-based fields
    "DJ008", # Model does not define `__str__` method
    "E402", # Module level import not at top of file
    "E501", # Line too long
    "PLR0915", # Too many statements
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0917", # Too many positional arguments (PLR0913's sibling, ignored for the same reason)
    # Imports inside functions are deliberate here: they break Django's
    # circular imports between apps, and keep heavy libraries (groq, the PDF
    # stack) out of workers that never use them.
    "PLC0415", # `import` should be at the top-level of a file
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "S105", # Possible hardcoded password
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hub.test_settings"
# SeleniumBase starts Firefox in permanent private browsing, where the page's
# cookies live in the private jar but WebDriver's cookie commands read and
# write the normal one: add_cookie stores a cookie the page never sends, and
# delete_all_cookies clears nothing. Chrome has no such split. Turning the
# disk cache off keeps the other half of private browsing, so a session still
# writes next to nothing. Ignored by every browser but Firefox.
addopts = """\
--firefox-pref=browser.privatebrowsing.autostart:false,\
browser.cache.disk.enable:false\
"""

[tool.mypy]
scripts_are_modules = true
show_traceback = true

# Enable strict mode, with some exceptions.
strict = true
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

# Enable optional errors.
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "unused-awaitable",
]

# Display the codes needed for # type: ignore[code] annotations.
show_error_codes = true

# Warn of unreachable or redundant code.
warn_unreachable = true

# To suppress all missing import errors for all untyped libraries
ignore_missing_imports = true


plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "hub.settings"

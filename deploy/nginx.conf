server {
    listen 80;
    server_name 127.0.0.1;
    server_name upai-hub.fly.dev;
    server_name upai-hub-staging.fly.dev;
    server_name hub.indiaultimate.org;
    access_log  /var/log/nginx/hub.log;
    root /var/www/hub/;

    location /static/ {
        root /var/www/hub;
    }

    location /media/ {
        root /data;
    }

    location = /favicon.ico {
        alias /var/www/hub/static/assets/favico.png;
    }

    # Server-Sent Events for the tournament agent. Buffering would hold the whole
    # turn back and deliver it in one lump, which defeats streaming. "^~" is what
    # makes this win over the regex location below.
    location ^~ /api/tournament-agent/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        # An agent turn can sit silent while the model thinks; outlast it.
        proxy_read_timeout 300s;
        client_max_body_size 10M;
    }

    location ~ ^/(api|admin|ckeditor)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }

    # FIXME: Not sure if there's a clean way to combine this with the previous block
    location = / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /;
    }
}
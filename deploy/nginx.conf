server {
    listen 80;
    server_name 127.0.0.1;
    server_name upai-hub.fly.dev;
    server_name upai-hub-staging.fly.dev;
    server_name hub.indiaultimate.org;
    access_log  /var/log/nginx/hub.log;
    root /var/www/hub/;

    # Debian defaults gzip_types to text/html, so the bundles went out uncompressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # Content-hashed names, so a cached copy can never be the wrong one. index.html
    # is rendered by Django per request and always names the current hashes.
    location ~ "^/static/(.*\.)?[0-9a-f]{12,32}\.[a-zA-Z0-9]+$" {
        root /var/www/hub;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed names (assets/favico.png, used by LOGO_URL and the favicon alias).
    location /static/ {
        root /var/www/hub;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location /media/ {
        root /data;
    }

    location = /favicon.ico {
        alias /var/www/hub/static/assets/favico.png;
    }

    # Server-Sent Events for the tournament agent. Buffering would hold the whole
    # turn back and deliver it in one lump, which defeats streaming. "^~" is what
    # makes this win over the regex location below.
    location ^~ /api/tournament-agent/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10M;
    }

    location ~ ^/(api|admin|ckeditor)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }

    # FIXME: Not sure if there's a clean way to combine this with the previous block
    location = / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /;
    }
}
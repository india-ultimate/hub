# fly.toml app configuration file generated for upai-hub on 2023-06-23T11:38:48+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "upai-hub"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"
# No swap_size_mb: Fly can't suspend a machine with swap (see auto_stop_machines).

[experimental]
  auto_rollback = true

[build]
  dockerfile = "Dockerfile"

[build.args]
  DJANGO_SETTINGS_MODULE = "hub.production"

[deploy]
  # Once per release, before any machine gets the new code.
  release_command = "python manage.py migrate"

[processes]
  app = "deploy/start.sh"
  worker = "deploy/start-worker.sh"

[env]
  PORT = "8000"
  DJANGO_SETTINGS_MODULE = "hub.production"
  # workers x threads must stay at or above soft_limit below.
  GUNICORN_WORKERS = "2"
  GUNICORN_THREADS = "8"

# Scale out, not up: five machines of this size (`fly scale count app=5`), which
# the proxy starts and suspends as needed. Each holds up to 16 DB connections.
[[vm]]
  processes = ["app"]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[services]]
  protocol = "tcp"
  internal_port = 80
  processes = ["app"]
  # Idle machines are suspended: they resume in under a second, for storage only.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 32
    soft_limit = 12

  # Answered by nginx, which start.sh starts only once gunicorn answers.
  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
    [services.http_checks.headers]
      # Fly sends the machine's IP, which Debian's default nginx site would answer.
      Host = "hub.indiaultimate.org"

# Fly's default gives up after 10 failures, e.g. through a long Postgres
# outage, and then no emails go out and no nightly jobs run.
[[restart]]
  policy = "always"
  processes = ["worker"]

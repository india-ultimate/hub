# fly.toml app configuration file generated for upai-hub on 2023-06-23T11:38:48+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "upai-hub"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"
swap_size_mb = 512

[experimental]
  auto_rollback = true

[build]
  dockerfile = "Dockerfile"

[build.args]
  DJANGO_SETTINGS_MODULE = "hub.production"

[deploy]
  # Once per release, before any machine gets the new code.
  release_command = "python manage.py migrate"

[processes]
  app = "deploy/start.sh"
  worker = "deploy/start-worker.sh"

[env]
  PORT = "8000"
  DJANGO_SETTINGS_MODULE = "hub.production"
  # Set by scripts/apply-profile.py; workers x threads must track the limits below.
  GUNICORN_WORKERS = "2"
  GUNICORN_THREADS = "8"

# Set by scripts/apply-profile.py.
[[vm]]
  processes = ["app"]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[services]]
  protocol = "tcp"
  internal_port = 80
  processes = ["app"]
  # The proxy starts a stopped machine when the running ones pass soft_limit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 32
    soft_limit = 12

  # Through nginx to gunicorn, so a machine still starting gets no traffic.
  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
    [services.http_checks.headers]
      X-Forwarded-Proto = "https"
